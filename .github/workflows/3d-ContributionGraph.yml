name: Stoic 3D Contribution Graph

on:
  schedule:
    # Every day at 18:00 UTC (11:30 PM IST)
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D contribution images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if ! git diff --cached --quiet; then
            git commit -m "Update 3D contribution graph"
            git push
          else
            echo "No changes to the contribution graph."
          fi
